<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead Orchestrator — Autonomous Pipeline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { font-size: 2.5rem; margin-bottom: 10px; color: #f1f5f9; }
    .subtitle { color: #94a3b8; margin-bottom: 40px; font-size: 1.1rem; }

    .pipeline-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stage-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      transition: all 0.3s;
      cursor: pointer;
    }

    .stage-card:hover {
      border-color: #64748b;
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .stage-card.discovered { border-top: 3px solid #3b82f6; }
    .stage-card.audited { border-top: 3px solid #8b5cf6; }
    .stage-card.qualified { border-top: 3px solid #ec4899; }
    .stage-card.messaged { border-top: 3px solid #f59e0b; }
    .stage-card.followed-up { border-top: 3px solid #10b981; }

    .stage-name { font-size: 0.9rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .stage-count { font-size: 3rem; font-weight: bold; color: #f1f5f9; }
    .stage-percent { color: #64748b; font-size: 0.85rem; margin-top: 10px; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-box {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
    }

    .stat-label { color: #94a3b8; font-size: 0.9rem; margin-bottom: 8px; }
    .stat-value { font-size: 2rem; font-weight: bold; color: #f1f5f9; }

    .pipeline-bar {
      background: #0f172a;
      border-radius: 8px;
      height: 40px;
      overflow: hidden;
      margin-top: 30px;
      border: 1px solid #334155;
    }

    .bar-section {
      height: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 500;
      font-size: 0.85rem;
    }

    .bar-discovered { background: #3b82f6; }
    .bar-audited { background: #8b5cf6; }
    .bar-qualified { background: #ec4899; }
    .bar-messaged { background: #f59e0b; }
    .bar-followed-up { background: #10b981; }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    button {
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    button:hover { background: #2563eb; transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    .last-run {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      color: #94a3b8;
      font-size: 0.9rem;
    }

    .error { color: #ef4444; background: #7f1d1d; padding: 20px; border-radius: 8px; margin-top: 20px; }
    .success { color: #10b981; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading { animation: pulse 2s infinite; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Lead Orchestrator</h1>
    <p class="subtitle">Autonomous lead discovery & outreach pipeline</p>

    <div class="controls">
      <input type="password" id="password" placeholder="Enter APP_PASSWORD" style="padding: 10px 20px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #e2e8f0;">
      <button onclick="loadStats()">Refresh Stats</button>
      <button onclick="testCron('discover')" style="background: #3b82f6;">Test Discover</button>
      <button onclick="testCron('audit')" style="background: #8b5cf6;">Test Audit</button>
      <button onclick="testCron('qualify')" style="background: #ec4899;">Test Qualify</button>
      <button onclick="testCron('outreach')" style="background: #f59e0b;">Test Outreach</button>
    </div>

    <div id="pipeline" class="pipeline-grid"></div>

    <div class="pipeline-bar">
      <div id="bar" class="bar-section" style="width: 0%;"></div>
    </div>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Total in Pipeline</div>
        <div class="stat-value" id="total">—</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Markets Active</div>
        <div class="stat-value" id="markets">—</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Discovery Rate (Today)</div>
        <div class="stat-value" id="today">—/day</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Conversion Rate</div>
        <div class="stat-value success" id="conversion">—</div>
      </div>
    </div>

    <div class="last-run" id="lastRun">Last run: Never</div>
    <div id="error" style="display: none;"></div>
  </div>

  <script>
    const stages = ['discovered', 'audited', 'qualified', 'messaged', 'followed_up'];
    const colors = ['#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981'];

    async function loadStats() {
      const password = document.getElementById('password').value;
      if (!password) {
        showError('Please enter APP_PASSWORD');
        return;
      }

      try {
        document.getElementById('error').style.display = 'none';
        const resp = await fetch('/api/stats', {
          headers: { 'Authorization': password }
        });

        if (!resp.ok) throw new Error('Unauthorized');

        const data = await resp.json();
        renderPipeline(data.pipeline);

        document.getElementById('total').textContent = data.totals.inPipeline;
        document.getElementById('markets').textContent = data.totals.markets;
        document.getElementById('today').textContent = data.totals.discoveredToday + '/day';
        document.getElementById('conversion').textContent = data.totals.conversionRate;

        const last = new Date(data.lastOutreach);
        document.getElementById('lastRun').textContent =
          `Last outreach: ${data.lastOutreach ? last.toLocaleString() : 'Never'}`;
      } catch (err) {
        showError(err.message);
      }
    }

    function renderPipeline(data) {
      const pipeline = document.getElementById('pipeline');
      pipeline.innerHTML = '';

      let totalLeads = Object.values(data).reduce((a, b) => a + b, 0);
      let barHtml = '';

      stages.forEach((stage, i) => {
        const count = data[stage] || 0;
        const percent = totalLeads > 0 ? ((count / totalLeads) * 100) : 0;

        const card = document.createElement('div');
        card.className = `stage-card ${stage}`;
        card.innerHTML = `
          <div class="stage-name">${stage.replace(/_/g, ' ')}</div>
          <div class="stage-count">${count}</div>
          <div class="stage-percent">${percent.toFixed(1)}%</div>
        `;
        pipeline.appendChild(card);

        if (percent > 0) {
          barHtml += `<div class="bar-section bar-${stage}" style="width: ${percent}%">${count}</div>`;
        }
      });

      document.getElementById('bar').innerHTML = barHtml || '<div style="color: #64748b;">No leads yet</div>';
    }

    async function testCron(job) {
      const password = document.getElementById('password').value;
      if (!password) {
        showError('Please enter APP_PASSWORD');
        return;
      }

      try {
        const resp = await fetch(`/api/cron-${job}`, {
          headers: { 'Authorization': process.env.CRON_SECRET || password }
        });
        const data = await resp.json();
        alert(`${job} test result:\n${JSON.stringify(data, null, 2)}`);
        loadStats();
      } catch (err) {
        showError(`Test failed: ${err.message}`);
      }
    }

    function showError(msg) {
      const el = document.getElementById('error');
      el.className = 'error';
      el.textContent = '❌ ' + msg;
      el.style.display = 'block';
    }

    // Load on page load
    loadStats();
    setInterval(loadStats, 60000); // Refresh every minute
  </script>
</body>
</html>
